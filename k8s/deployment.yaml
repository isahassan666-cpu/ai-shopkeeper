
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-shopkeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-shopkeeper
  template:
    metadata:
      labels:
        app: ai-shopkeeper
    spec:
      containers:
        - name: ai-shopkeeper
          image: ai-shopkeeper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
